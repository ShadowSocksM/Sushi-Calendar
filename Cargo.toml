[package]
name="mr_calendar"
version="2.5.102"
edition="2021"

[dependencies]
eframe="0.29"
egui="0.29"
chrono="0.4"
serde={version="1",features=["derive"]}
serde_json="1"
dirs="5"
fontdue="0.9"
unicode-bidi="0.3"
arabic_reshaper="0.4"
image={version="0.25",default-features=false,features=["png"]}
tray-icon="0.19"

[target.'cfg(windows)'.dependencies]
winreg="0.52"
windows-sys={version="0.59",features=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_System_LibraryLoader","Win32_System_Threading","Win32_Security","Win32_UI_Input_KeyboardAndMouse","Win32_Graphics_Gdi"]}

[build-dependencies]
winres="0.1"

[profile.release]
opt-level=3
lto=true
codegen-units=1
strip=true
